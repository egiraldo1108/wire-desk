name: Build feeds

on:
  schedule:
    # Deliberately NOT */15 on the hour boundary. GitHub's free tier queues
    # scheduled jobs and silently drops them under load, and the :00/:15/:30
    # marks are the most contested minutes on the platform — asking for every
    # 15 minutes there was reliably delivering one run every few hours.
    # Odd minutes, four times an hour, lands far more of them.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths: ['index.html', 'scripts/build-feeds.js']

permissions:
  contents: write

concurrency:
  group: build-feeds
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch feeds and resolve live channels
        run: node scripts/build-feeds.js

      - name: Commit feeds.json
        run: |
          git config user.name  "wire-desk-bot"
          git config user.email "actions@github.com"
          git add feeds.json live.json
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "feeds + live: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
